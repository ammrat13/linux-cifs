---

- name: Make SMB directory
  ansible.builtin.file:
    path: /var/smb/
    state: directory
    mode: "0755"

- name: Populate SMB directory
  ansible.builtin.copy:
    src: flag.txt
    dest: /var/smb/
    mode: "0644"

- name: Configure KSMBD
  ansible.builtin.template:
    src: ksmbd.conf.j2
    dest: /etc/ksmbd/ksmbd.conf
    mode: "0644"
